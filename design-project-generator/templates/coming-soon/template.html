<main class="page">
	<span class="rings" aria-hidden="true"></span>
	<div class="inner">
		<p class="brand" data-dpg-field="brand">Brand</p>
		<h1 data-dpg-field="headline">Something new is coming</h1>
		<p class="lead" data-dpg-field="subheadline">A supporting line about the launch.</p>

		<div class="countdown" aria-label="Countdown to launch">
			<span><b data-unit="days">00</b><small>Days</small></span>
			<span><b data-unit="hours">00</b><small>Hours</small></span>
			<span><b data-unit="minutes">00</b><small>Minutes</small></span>
			<span><b data-unit="seconds">00</b><small>Seconds</small></span>
		</div>

		<form class="signup" novalidate>
			<label class="sr" for="email">Email address</label>
			<input id="email" type="email" placeholder="you@example.com" required />
			<button type="submit" data-dpg-field="button">Notify me</button>
		</form>
		<p class="state" role="status"></p>
		<p class="foot" data-dpg-field="contact">hello@example.com</p>
	</div>
</main>
