<div class="stage">
	<article class="card" role="img" aria-label="Social media post preview">
		<span class="card__shape card__shape--a" aria-hidden="true"></span>
		<span class="card__shape card__shape--b" aria-hidden="true"></span>
		<header class="card__top">
			<span class="card__brand" data-dpg-field="brand">Brand</span>
			<span class="card__tag" data-dpg-field="eyebrow">Category</span>
		</header>
		<h1 class="card__headline" data-dpg-field="headline">Your headline goes here</h1>
		<p class="card__sub" data-dpg-field="subheadline">A supporting line.</p>
		<footer class="card__foot">
			<span class="card__cta" data-dpg-field="button">Learn more</span>
			<span class="card__handle" data-dpg-field="contact">@handle</span>
		</footer>
	</article>

	<div class="formats">
		<button type="button" class="chip is-active" data-format="square">1080 x 1080</button>
		<button type="button" class="chip" data-format="portrait">1080 x 1350</button>
		<button type="button" class="chip" data-format="story">1080 x 1920</button>
		<button type="button" class="chip" data-format="wide">1200 x 630</button>
	</div>
</div>
