<main class="product">
	<div class="gallery">
		<span class="shot" data-shot="1" aria-hidden="true"></span>
		<div class="thumbs">
			<button type="button" class="is-active" data-shot="1"><span></span></button>
			<button type="button" data-shot="2"><span></span></button>
			<button type="button" data-shot="3"><span></span></button>
		</div>
	</div>

	<div class="detail">
		<p class="crumb" data-dpg-field="eyebrow">Category</p>
		<h1 data-dpg-field="headline">Product name</h1>
		<p class="price"><span data-dpg-field="price">29</span></p>
		<p class="blurb" data-dpg-field="description">A short description of the product.</p>

		<fieldset class="variants">
			<legend>Size</legend>
			<label><input type="radio" name="size" value="s" /><span>S</span></label>
			<label><input type="radio" name="size" value="m" checked /><span>M</span></label>
			<label><input type="radio" name="size" value="l" /><span>L</span></label>
			<label><input type="radio" name="size" value="xl" /><span>XL</span></label>
		</fieldset>

		<div class="buy">
			<button type="button" class="add" data-dpg-field="button">Add to basket</button>
			<button type="button" class="save" aria-label="Save for later">Save</button>
		</div>
		<p class="note" data-dpg-field="contact">Free returns within 30 days</p>
	</div>
</main>
